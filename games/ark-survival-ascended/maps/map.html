<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ARK: Survival Ascended のマップ別ガイド入口。">
  <title>Map | ARK: Survival Ascended</title>
  <link rel="stylesheet" href="../../../assets/css/common.css">
  <style>
    .map-note{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#070707;color:#999;font-size:12px}
    .card.disabled .arrow{display:none}
  </style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <a class="brand" href="../">ARK: Survival Ascended</a>
    <nav class="topnav" aria-label="ARKナビゲーション">
      <a href="../maps.html">← マップ一覧</a>
      <a href="../">ARK TOP</a>
      <a href="../../../">ゲームライブラリ</a>
    </nav>
  </header>

  <div class="breadcrumbs"><a href="../../../">ゲームライブラリ</a><span>/</span><a href="../">ARK</a><span>/</span><a href="../maps.html">マップ</a><span>/</span><span id="crumbMap">Map</span></div>
  <a class="back-link" href="../maps.html">← マップ一覧へ戻る</a>

  <section class="hero">
    <div class="eyebrow" id="mapEyebrow">ARK · MAP</div>
    <h1 id="mapTitle">Map</h1>
    <p id="mapCopy">このマップで見たい情報をカテゴリごとに選びます。</p>
    <div class="meta" id="mapMeta"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">ガイド</h2><div class="section-note">見たい内容を選択</div></div>
    <div class="grid" id="guideGrid"></div>
    <div class="map-note">生息地一覧は ARK Official Community Wiki の各マップの「Creatures」欄を参照して生成します。個別ページも公式Wikiを確認元に使うため、追加・変更された生物を追いやすい構成です。</div>
  </section>

  <footer class="footer"><a class="back-link" href="../maps.html">← マップ一覧へ戻る</a><br><span id="footerMap">ARK: Survival Ascended</span></footer>
</main>

<script src="map-data.js"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const slug = params.get('map') || 'astraeos';
  const map = window.ARK_MAPS?.[slug];
  if (!map) {
    document.getElementById('mapTitle').textContent = 'マップが見つかりません';
    document.getElementById('mapCopy').textContent = 'マップ一覧から選び直してください。';
    return;
  }

  document.title = `${map.name} | ARK: Survival Ascended`;
  document.getElementById('crumbMap').textContent = map.name;
  document.getElementById('mapEyebrow').textContent = `ARK · MAP · ${map.name.toUpperCase()}`;
  document.getElementById('mapTitle').textContent = map.name;
  document.getElementById('mapCopy').textContent = `${map.name}で見たい情報をカテゴリごとに分けた入口ページ。素材集め、生物の生息地などをここから選びます。`;
  document.getElementById('mapMeta').innerHTML = `${map.current ? '<span class="pill"><span class="status-dot"></span>プレイ中</span>' : '<span class="pill">実装済み</span>'}<span class="pill">${map.type}</span><span class="pill">ASA</span>`;
  document.getElementById('footerMap').textContent = `ARK: Survival Ascended · ${map.name}`;

  const grid = document.getElementById('guideGrid');
  const resourceCard = map.resourceUrl
    ? `<a class="card" href="${map.resourceUrl}"><div class="arrow">→</div><small>RESOURCES</small><h3>素材集め</h3><p>素材別のおすすめ恐竜・道具・レベル帯ごとの集め方と、このマップ固有の採取スポット。</p></a>`
    : `<div class="card disabled"><small>RESOURCES · COMING LATER</small><h3>素材集め</h3><p>素材別のおすすめ採取方法と、このマップ固有の採取スポットを今後追加。</p></div>`;

  grid.innerHTML = `
    ${resourceCard}
    <a class="card" href="habitats.html?map=${encodeURIComponent(slug)}">
      <div class="arrow">→</div><small>CREATURE HABITATS</small><h3>生息地</h3>
      <p>このマップに出現する生物を検索し、個別の生息地マップ・基本情報・参考元を確認。</p>
    </a>
    <div class="card disabled"><small>COMING LATER</small><h3>洞窟 / アーティファクト</h3><p>洞窟入口、危険生物、持ち物、アーティファクトなどをまとめる予定。</p></div>
    <div class="card disabled"><small>COMING LATER</small><h3>ボス / 特殊コンテンツ</h3><p>ボスやマップ固有の特殊コンテンツをまとめる予定。</p></div>`;
})();
</script>
</body>
</html>
