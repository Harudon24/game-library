name: Temporary Astraeos site patch

on:
  push:
    paths:
      - '.github/workflows/tmp-astraeos-spawn-scrape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Astraeos habitat pages
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected 1 match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          habitats = 'games/ark-survival-ascended/maps/habitats.html'
          creature = 'games/ark-survival-ascended/maps/creature.html'
          burrowbuck = 'games/ark-survival-ascended/maps/astraeos/creatures/burrowbuck.html'

          replace_once(
              habitats,
              '<div class="meta"><span class="pill">検索対応</span><span class="pill">公式Wiki参照</span><span class="pill" id="creatureCountPill">読み込み中</span></div>',
              '<div class="meta"><span class="pill">検索対応</span><span class="pill" id="sourcePill">公式Wiki参照</span><span class="pill" id="creatureCountPill">読み込み中</span></div>'
          )
          replace_once(
              habitats,
              '<script src="map-data.js"></script>\n<script>',
              '<script src="map-data.js"></script>\n<script src="astraeos/kamigame-spawns.js"></script>\n<script>'
          )
          replace_once(
              habitats,
              '''  const wikiUrl = `https://ark.wiki.gg/wiki/${encodeURIComponent(map.wikiPage).replace(/%3A/g, ':')}`;
  document.getElementById('sourceNote').innerHTML = `一覧の確認元: <a href="${wikiUrl}" target="_blank" rel="noopener">ARK Official Community Wiki — ${map.name}</a>。Wikiの「Creatures」セクションを読み込んでいるため、追加・変更された生物を反映しやすくしています。`;''',
              '''  const wikiUrl = `https://ark.wiki.gg/wiki/${encodeURIComponent(map.wikiPage).replace(/%3A/g, ':')}`;
  const kamigameUrl = window.ASTRAEOS_KAMIGAME_SOURCE || 'https://kamigame.jp/asa/page/365586504895978211.html';
  if(slug==='astraeos'){
    document.getElementById('sourcePill').textContent='神ゲー攻略参照';
    document.getElementById('sourceNote').innerHTML = `一覧・生息地画像の確認元: <a href="${kamigameUrl}" target="_blank" rel="noopener">神ゲー攻略 — アストレオスの生物スポーンマップ一覧</a>。掲載画像をそのまま生息地確認用に表示しています。`;
  }else{
    document.getElementById('sourceNote').innerHTML = `一覧の確認元: <a href="${wikiUrl}" target="_blank" rel="noopener">ARK Official Community Wiki — ${map.name}</a>。Wikiの「Creatures」セクションを読み込んでいるため、追加・変更された生物を反映しやすくしています。`;
  }'''
          )
          replace_once(
              habitats,
              '''  function detailUrl(c){
    const override=window.ARK_CREATURE_OVERRIDES?.[`${slug}|${c.name}`];
    if(override)return override;
    const q=new URLSearchParams({map:slug,name:c.name,wiki:c.wikiTitle});
    return 'creature.html?'+q.toString();
  }''',
              '''  function detailUrl(c){
    if(slug==='astraeos'){
      if(c.name==='ブローバック')return 'astraeos/creatures/burrowbuck.html';
      const q=new URLSearchParams({map:slug,kg:c.name});
      return 'creature.html?'+q.toString();
    }
    const override=window.ARK_CREATURE_OVERRIDES?.[`${slug}|${c.name}`];
    if(override)return override;
    const q=new URLSearchParams({map:slug,name:c.name,wiki:c.wikiTitle});
    return 'creature.html?'+q.toString();
  }'''
          )
          replace_once(
              habitats,
              '''  async function load(){
    try{''',
              '''  async function load(){
    if(slug==='astraeos' && Array.isArray(window.ASTRAEOS_KAMIGAME_SPAWNS)){
      const list=window.ASTRAEOS_KAMIGAME_SPAWNS.map(row=>({
        name:row.name,
        wikiTitle:'',
        group:row.image?'生息地マップあり':'神ゲー攻略で調査中',
        article:row.article,
        portrait:row.portrait,
        image:row.image,
        status:row.status,
        kamigame:true
      }));
      showCreatures(list,false);
      return;
    }
    try{'''
          )

          replace_once(
              creature,
              '<div class="meta"><span class="pill" id="mapPill">Map</span><span class="pill">生息地</span><span class="pill">公式Wiki参照</span></div>',
