name: Temporary Astraeos site patch

on:
  push:
    paths:
      - '.github/workflows/tmp-astraeos-spawn-scrape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Astraeos habitat pages
        run: python .github/tmp-astraeos-patch.py
      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/ark-survival-ascended/maps/habitats.html games/ark-survival-ascended/maps/creature.html games/ark-survival-ascended/maps/astraeos/creatures/burrowbuck.html
          git diff --cached --quiet && exit 0
          git commit -m "Use Kamigame habitat maps for Astraeos creatures"
          git push
