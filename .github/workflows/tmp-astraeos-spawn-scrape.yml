name: Temporary Astraeos spawn scrape

on:
  push:
    paths:
      - '.github/workflows/tmp-astraeos-spawn-scrape.yml'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4 requests

      - name: Scrape Kamigame Astraeos spawn table
        shell: python
        run: |
          import json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          URL = 'https://kamigame.jp/asa/page/365586504895978211.html'
          headers = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'}
          r = requests.get(URL, headers=headers, timeout=30)
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')

          heading = soup.find('h2', id='アストレオスの生物スポーンマップ一覧')
          if heading is None:
              raise RuntimeError('Target heading not found')
          table = heading.find_next('table')
          if table is None:
              raise RuntimeError('Target table not found')

          rows = []
          for tr in table.find_all('tr'):
              cells = tr.find_all(['th','td'])
              if len(cells) < 2:
                  continue
              first, second = cells[0], cells[1]
              name_img = first.find('img', alt=True)
              name = (name_img.get('alt','') if name_img else first.get_text(' ', strip=True)).strip()
              if not name or name == '生物':
                  continue
              article_link = first.find('a', href=True)
              article = urljoin(URL, article_link['href']) if article_link else ''
              portrait = name_img.get('src','') if name_img else ''
              map_img = second.find('img', alt=lambda v: isinstance(v,str) and v.endswith('_マップ')) or second.find('img')
              image = map_img.get('src','') if map_img else ''
              status = second.get_text(' ', strip=True)
              rows.append({'name':name,'article':article,'portrait':portrait,'image':image,'status':status})

          print('ASTRAEOS_JSON_BEGIN')
          print(json.dumps(rows, ensure_ascii=False, separators=(',',':')))
          print('ASTRAEOS_JSON_END')
          print(f'ROWS={len(rows)} IMAGES={sum(bool(r["image"]) for r in rows)} RESEARCHING={sum("調査中" in r["status"] for r in rows)}')
