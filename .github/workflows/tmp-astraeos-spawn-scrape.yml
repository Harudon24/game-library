name: Temporary Astraeos spawn scrape

on:
  push:
    paths:
      - '.github/workflows/tmp-astraeos-spawn-scrape.yml'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Kamigame page structure
        shell: python
        run: |
          import requests
          URL = 'https://kamigame.jp/asa/page/365586504895978211.html'
          headers = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'}
          r = requests.get(URL, headers=headers, timeout=30)
          r.raise_for_status()
          html = r.text
          print('LENGTH', len(html))
          for needle in ['アストレオスの生物スポーンマップ一覧','アフリカマイマイ','ブローバック','img.kamigame.jp']:
              i = html.find(needle)
              print('\n===', needle, 'INDEX', i, '===')
              if i >= 0:
                  print(html[max(0,i-2500):i+5500])
