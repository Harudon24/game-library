          )
          replace_once(
              creature,
              '<script src="map-data.js"></script>\n<script>',
              '<script src="map-data.js"></script>\n<script src="astraeos/kamigame-spawns.js"></script>\n<script>'
          )
          replace_once(
              creature,
              '''  const slug=params.get('map')||'astraeos';
  const map=window.ARK_MAPS?.[slug];
  const requestedName=params.get('name')||'Creature';
  const wikiTitle=params.get('wiki')||requestedName.replace(/ /g,'_');''',
              '''  const slug=params.get('map')||'astraeos';
  const map=window.ARK_MAPS?.[slug];
  const kgName=params.get('kg')||'';
  const kgRow=slug==='astraeos' && kgName ? (window.ASTRAEOS_KAMIGAME_SPAWNS||[]).find(row=>row.name===kgName) : null;
  const requestedName=kgRow?.name||params.get('name')||'Creature';
  const wikiTitle=params.get('wiki')||requestedName.replace(/ /g,'_');'''
          )
          replace_once(
              creature,
              '''  document.getElementById('sourceLinks').innerHTML=`<a href="${wikiCreatureUrl}" target="_blank" rel="noopener">ARK Official Community Wiki — ${escapeHtml(requestedName)}</a><a href="${wikiMapUrl}" target="_blank" rel="noopener">${escapeHtml(map.name)} マップ情報</a>`;''',
              '''  const kamigameSource=window.ASTRAEOS_KAMIGAME_SOURCE||'https://kamigame.jp/asa/page/365586504895978211.html';
  document.getElementById('sourceLinks').innerHTML=kgRow
    ? `<a href="${kgRow.article}" target="_blank" rel="noopener">神ゲー攻略 — ${escapeHtml(requestedName)}</a><a href="${kamigameSource}" target="_blank" rel="noopener">アストレオス生物スポーンマップ一覧</a>`
    : `<a href="${wikiCreatureUrl}" target="_blank" rel="noopener">ARK Official Community Wiki — ${escapeHtml(requestedName)}</a><a href="${wikiMapUrl}" target="_blank" rel="noopener">${escapeHtml(map.name)} マップ情報</a>`;'''
          )
          replace_once(
              creature,
              '''  async function load(){
    try{''',
              '''  function renderKamigame(){
    document.getElementById('sourcePill').textContent='神ゲー攻略参照';
    document.getElementById('imageSourceNote').textContent='神ゲー攻略の画像を参照';
    document.getElementById('creatureIntro').textContent=kgRow.image
      ? `神ゲー攻略のアストレオス生物スポーン一覧から、${requestedName} の生物画像と生息地マップを表示しています。`
      : `神ゲー攻略では、${requestedName} のアストレオス生息地は現在「調査中」です。生物ページと一覧へのリンクは下に残しています。`;

    const portrait=document.getElementById('portraitPanel');
    if(kgRow.portrait){
      portrait.innerHTML=`<img src="${kgRow.portrait}" alt="${escapeHtml(requestedName)}" referrerpolicy="no-referrer">`;
    }else{
      portrait.innerHTML='<div class="portrait-placeholder">神ゲー攻略から生物画像を取得できませんでした。</div>';
    }

    spawnLayer.style.display='none';
    spawnLayer.removeAttribute('src');
    if(kgRow.image){
      baseMap.style.display='block';
      baseMap.src=kgRow.image;
      baseMap.alt=`Astraeosの${requestedName}生息地マップ`;
      mapWarning.style.display='none';
      document.getElementById('mapCaption').textContent=`Astraeos：神ゲー攻略の掲載画像。色付き範囲が ${requestedName} の出現エリアの目安です。`;
    }else{
      baseMap.removeAttribute('src');
      baseMap.style.display='none';
      mapWarning.style.display='block';
      mapWarning.textContent=`神ゲー攻略では現在、${requestedName} のAstraeosスポーン範囲は「調査中」です。参考元リンクから更新状況を確認できます。`;
      document.getElementById('mapCaption').textContent='生息地マップは確認元で未掲載です。';
    }

    const factGrid=document.getElementById('factGrid');
    const factsLoading=document.getElementById('factsLoading');
    factGrid.innerHTML=`<div class="fact"><small>生息地マップ</small><strong>${kgRow.image?'掲載あり':'調査中'}</strong></div><div class="fact"><small>確認元</small><strong>神ゲー攻略</strong></div>`;
    factGrid.hidden=false;
    factsLoading.hidden=true;

    const infoPanel=document.querySelector('.info-panel');
    infoPanel.innerHTML=`<h3>このページの使い方</h3><p>アストレオスの生息地は神ゲー攻略の「アストレオスの生物スポーンマップ一覧」に掲載されている画像を使用しています。</p><p>テイム方法・能力などの詳細は下の神ゲー攻略の生物ページから確認できます。</p>`;
  }

  async function load(){
    try{'''
          )
          replace_once(
              creature,
              '''  }
  load();
})();''',
              '''  }
  if(kgRow){renderKamigame();return}
  load();
})();'''
          )

          replace_once(
              burrowbuck,
              'https://img.kamigame.jp/4_G1rPKNkXkRA223W5PXYus07cdUQGH6Qu0QikbLW8DLoLqaAFIu6qVNo3-S08ZELBQeSt-iezJB9kgoC7cdOP-Qozy-KWsk03YDqtxHnt5N%3Ds0',
              'https://lh3.googleusercontent.com/VDxa6ilsp9HXjB7tSEF0RFkAZ_ZhuSqv_7Qt9A3abDXU9zQQaooYbfweH3PbdFS71RFWcni7IkIsFooadPdOqWBLV4NDR5cctgIaVdfIHC8=s0'
          )

      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/ark-survival-ascended/maps/habitats.html games/ark-survival-ascended/maps/creature.html games/ark-survival-ascended/maps/astraeos/creatures/burrowbuck.html
          git diff --cached --quiet && exit 0
          git commit -m "Use Kamigame habitat maps for Astraeos creatures"
          git push
