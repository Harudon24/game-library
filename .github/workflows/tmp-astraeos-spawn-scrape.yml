name: Temporary Astraeos spawn scrape

on:
  push:
    paths:
      - '.github/workflows/tmp-astraeos-spawn-scrape.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4 requests

      - name: Generate Astraeos spawn data
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          URL = 'https://kamigame.jp/asa/page/365586504895978211.html'
          headers = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'}
          r = requests.get(URL, headers=headers, timeout=30)
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')

          heading = soup.find('h2', id='アストレオスの生物スポーンマップ一覧')
          if heading is None:
              raise RuntimeError('Target heading not found')
          table = heading.find_next('table')
          if table is None:
              raise RuntimeError('Target table not found')

          rows = []
          for tr in table.find_all('tr'):
              cells = tr.find_all(['th','td'])
              if len(cells) < 2:
                  continue
              first, second = cells[0], cells[1]
              name_img = first.find('img', alt=True)
              name = (name_img.get('alt','') if name_img else first.get_text(' ', strip=True)).strip()
              if not name or name == '生物':
                  continue
              article_link = first.find('a', href=True)
              article = urljoin(URL, article_link['href']) if article_link else ''
              portrait = name_img.get('src','') if name_img else ''
              map_img = second.find('img', alt=lambda v: isinstance(v,str) and v.endswith('_マップ')) or second.find('img')
              image = map_img.get('src','') if map_img else ''
              status = second.get_text(' ', strip=True)
              rows.append({'name':name,'article':article,'portrait':portrait,'image':image,'status':status})

          out = Path('games/ark-survival-ascended/maps/astraeos/kamigame-spawns.js')
          out.parent.mkdir(parents=True, exist_ok=True)
          payload = json.dumps(rows, ensure_ascii=False, separators=(',',':'))
          out.write_text(
              '// Generated from 神ゲー攻略 Astraeos spawn map list.\n'
              f'window.ASTRAEOS_KAMIGAME_SOURCE={json.dumps(URL, ensure_ascii=False)};\n'
              f'window.ASTRAEOS_KAMIGAME_SPAWNS={payload};\n',
              encoding='utf-8'
          )
          print(f'ROWS={len(rows)} IMAGES={sum(bool(x["image"]) for x in rows)} RESEARCHING={sum("調査中" in x["status"] for x in rows)}')

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/ark-survival-ascended/maps/astraeos/kamigame-spawns.js
          git diff --cached --quiet && exit 0
          git commit -m "Add Astraeos Kamigame spawn data"
          git push
