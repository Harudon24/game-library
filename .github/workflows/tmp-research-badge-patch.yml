name: Temporary research badge patch

on:
  push:
    paths:
      - '.github/workflows/tmp-research-badge-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch habitat list
        run: python .github/tmp-research-badge-patch.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/ark-survival-ascended/maps/habitats.html
          git diff --cached --quiet && exit 0
          git commit -m "Show research status on Astraeos creature cards"
          git push
