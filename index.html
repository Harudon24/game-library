<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ゲームごとのガイド、ツール、メモをまとめた個人用ライブラリ。">
  <title>ゲームライブラリ</title>
  <link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <a class="brand" href="./">ゲームライブラリ</a>
    <nav class="topnav" aria-label="メインナビゲーション">
      <a href="#games">ゲーム</a>
    </nav>
  </header>

  <section class="hero">
    <div class="eyebrow">個人用アーカイブ</div>
    <h1>ゲームライブラリ</h1>
    <p>
      プレイ中に作った攻略メモ、便利ツール、覚えておきたい情報をゲームごとにまとめています。
      遊んだゲームが増えるたびに育っていく個人用アーカイブです。
    </p>
    <div class="meta">
      <span class="pill"><span class="status-dot"></span>1ゲーム</span>
      <span class="pill">個人用アーカイブ</span>
    </div>
  </section>

  <section class="section" id="games">
    <div class="section-head">
      <h2 class="section-title">ゲーム</h2>
      <div class="section-note">新しい順</div>
    </div>

    <div class="game-grid">
      <a class="card game-card" href="games/incursion-red-river/">
        <div class="arrow">→</div>
        <small>2026 · プレイ中</small>
        <h2>Incursion:<br>Red River</h2>
        <p>ルート品の実用表、プレイ中のメモ、今後追加する便利ツール。</p>
        <div class="game-meta">
          <span class="stat">1ガイド</span>
          <span class="stat">メモ</span>
        </div>
      </a>
    </div>
  </section>

  <footer class="footer">
    個人用ゲームライブラリ
  </footer>
</main>
</body>
</html>
